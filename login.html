<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EventHub - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }


        .container {
            width: 400px;
            background: white;

            padding: 35px;

            margin: 80px auto;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }


        h1 {
            text-align: center;
            margin-bottom: 10px;
        }


        h2 {
            text-align: center;
            margin-bottom: 25px;
        }


        .subtitle {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
        }


        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }


        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background: #ff4b2b;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {
            background: #e63e20;
        }


        .register-link {
            text-align: center;

            margin-top: 20px;
        }


        .register-link a {
            color: blue;

            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="container">


        <h1>🎟 EventHub</h1>


        <h2>Login</h2>


        <p class="subtitle">
            Login to book your favorite events
        </p>


        <form id="loginForm">


            <label for="email">
                Email ID
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


    </div>



    <script>


        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {


                event.preventDefault();


                const email =
                    document.getElementById("email").value;


                const password =
                    document.getElementById("password").value;



                // Get registered user

                const storedUser =
                    localStorage.getItem("eventUser");



                // If user has not registered

                if (!storedUser) {

                    alert(
                        "Please register first!"
                    );

                    window.location.href =
                        "register.html";

                    return;
                }



                // Convert stored data

                const user =
                    JSON.parse(storedUser);



                // Check email and password

                if (
                    email === user.email &&
                    password === user.password
                ) {


                    alert(
                        "Login successful!"
                    );


                    window.location.href =
                        "events.html";


                } else {


                    alert(
                        "Invalid Email ID or Password!"
                    );

                }


            });


    </script>


</body>

</html>
